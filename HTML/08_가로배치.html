<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가로배치</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .box {
      background-color: beige;
    }
    .box .list {
      display: flex;
      justify-content: space-between;
      width: 1595px;
      background-color: yellow;
      margin: 0 auto;
    }
    .box .list .item {
      width: 380px;
      background-color: aquamarine;
      border: 1px solid black;  
      padding: 20px;
      box-sizing: border-box;
    }
    .box .list .item img {
      width: 100%;
      height: 420px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="list">
      <div class="item">
        <img src="img/tanya-barrow-wriyfkj4I3o-unsplash.jpg" alt="">
        <div class="text">
          <h1>제목</h1>
          <p>문장, 문단 내용 작성</p>
          <span>지역</span>
        </div>        
      </div><!-- .item -->
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div> 
    </div><!-- .list -->
  </div><!-- .box -->
</body>
</html>
