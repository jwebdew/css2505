<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예제</title>
  <style>
    div {
      width: 500px;
      background-color: skyblue;
      padding: 60px;
    }
    p {
      /* 배경색 : white; 
      모서리곡선 : 30px;
      내부여백 : 10px; */
      background-color: white;
      border-radius: 30px;
      padding: 10px;
      padding-left: 20px;
    }
    h1 {
      /* 글자크기
      색상
      내부여백 */
      margin-bottom: 100px;
    }
  </style>
</head>
<body>
  <!-- https://github.com/jwebdew/css2505 -->
  <!-- alt + shift + a -->   
  <!-- ctrl + / -->
  <div>
    <h1>슬림 버니 쉐이크<br />
이럴 때 드세요!</h1>

      <p>간편하고 맛있게 체중 조절을 하고 싶을 때</p>
      <p>바쁜 일상 속, 규칙적인 식단 관리가 필요할 때</p>
      <p> 운동 전, 후 단백질 보충이 필요할 때</p>
      <p>맛 없는 식단에 질렸을 때</p>
  </div>


</body>
</html>
