<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css 선택자</title>
  <style>
    li {
      background-color: aqua;
      font-size: 30px;
    }

    }

  <ul>
    <li>menu 1</li>
    <li class="bg">menu 2</li>

</html>
