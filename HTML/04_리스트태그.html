<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리스트태그</title>
</head>
<body>
  <!--복사 :  alt + shift + 방향키  -->
  <ol>
    <li>순서가 있는 리스트 태그</li>
    <li>순서가 있는 리스트 태그</li>
    <li>순서가 있는 리스트 태그</li>
  </ol>

  <!-- 줄바꿈 : alt + z  -->
  <ul>
    <li style="color: yellowgreen;">순서가 없는 리스트 <span style="color: red;">태그</span></li>
    <li>순서가 없는 리스트 태그</li>
    <li>순서가 없는 리스트 태그</li>
  </ul>
</body>
</html>
