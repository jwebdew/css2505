<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여백</title>
  <style>
    div {
      width: 300px;
      height: 300px;
      background-color: aqua;
      margin: 50px;  
      /* 외부여백 : 네변 모두 50px */
    }
    .margin2 {
      margin: 80px 100px;
      /* 외부여백 : 위아래80px 좌우100px */
    }
    .margin3 {
      margin: 10px 50px 100px;
      /* 외부여백: 위10px 좌우50px 아래100px */
    }
    .margin4 {
      margin: 10px 20px 50px 100px;
    }
    .margin5 {
      margin-top: 100px;
      margin-bottom: 10px;
      margin-left: 30px;
      margin-right: 40px;
    }
    .margin1 {
      margin: 30px auto;
      /* 좌우 auto 브라우저 화면 가운데 배치 */
    }


    ul li {
      width: 100px;
      height: 60px;
      border: 1px solid blue;
      /* 테두리 : 두께 스타일(실선) 컬러*/
      padding: 20px; 
      /* 내부여백: 상하좌우 20px */
      list-style: none;/* 블릿(동그라미) 없애기 */
      margin: 10px;
    }
    ul {
      display: flex; 
    }

    ol {
      display: flex;
    }
    ol li {
      width: 50px;
      height: 50px;
      background-color: aquamarine;
      border: 1px solid orange;

      list-style: none;/* 숫자없애기 */
    }
  </style>
</head>
<body>
  <!-- margin/padding 121~ -->
   <!-- 부모자식 90~ -->
  <div class="margin1">margin 1</div>
  <div class="margin2">margin 2</div>
  <div class="margin3">margin 3</div>
  <div class="margin4">margin 4</div>
  <div class="margin5">margin 5</div>

  <ul>
    <li>padding 1</li>
    <li>padding 2</li>
  </ul>

  <ol>
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
  </ol>
</body>
</html>
